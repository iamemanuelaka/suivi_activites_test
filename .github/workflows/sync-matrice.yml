name: Sync Kobo -> Matrice de suivi

on:
  # Mise à jour toutes les 3 heures (sans email) ET envoi hebdomadaire le lundi à 07:00 UTC
  schedule:
    - cron: "15 */3 * * *"
    - cron: "0 7 * * 1"
  
  # Lancement manuel
  workflow_dispatch:
    inputs:
      send_mail:
        description: "Envoyer l'e-mail avec la matrice"
        type: boolean
        default: false
      prepare_dda:
        description: "Préparer les données Dynamic Data Attachments"
        type: boolean
        default: false
  
  # Webhook Kobo (optionnel)
  repository_dispatch:
    types: [kobo_submission]

permissions:
  contents: write

concurrency:
  group: sync-matrice
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Africa/Abidjan
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      
      - name: Installer les dépendances
        run: pip install -r requirements.txt
      
      - name: Déterminer le mode (hebdo ou simple)
        id: mode
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.send_mail }}" != "true" ] && [ "${{ github.event.schedule }}" != "0 7 * * 1" ]; then
            ARGS="--no-mail"
          fi
          if [ "${{ github.event.inputs.prepare_dda }}" = "true" ]; then
            ARGS="$ARGS --prepare-dda"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"
      
      - name: Synchroniser Kobo -> matrice
        id: sync
        env:
          KOBO_URL: ${{ vars.KOBO_URL || 'https://kf.kobotoolbox.org' }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          MATRIX_DIR: matrices
          MATRIX_KEEP: "8"
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          DDA_OUTPUT_DIR: data/dda
        run: python kobo_matrice_sync.py ${{ steps.mode.outputs.args }}
      
      - name: Enregistrer la matrice dans le dépôt
        if: "${{ !cancelled() }}"
        run: |
          git config user.name "kobo-sync-bot"
          git config user.email "kobo-sync-bot@users.noreply.github.com"
          git add -A matrices data/dda
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Matrice + DDA mis à jour ($(date +%d/%m/%Y' '%H:%M))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
      
      - name: Archiver la matrice (téléchargeable)
        if: "${{ steps.sync.outputs.matrix_path != '' }}"
        uses: actions/upload-artifact@v4
        with:
          name: matrice-de-suivi
          path: ${{ steps.sync.outputs.matrix_path }}
          retention-days: 30
