name: Sync Kobo -> Matrice de suivi

on:
  schedule:
    - cron: "15 */3 * * *"   # mise à jour toutes les 3 h (sans e-mail, sans commit s'il n'y a rien de nouveau)
    - cron: "0 7 * * 1"      # envoi hebdomadaire : lundi 07:00 UTC (= Abidjan)
  workflow_dispatch:
    inputs:
      send_mail:
        description: "Envoyer l'e-mail avec la matrice"
        type: boolean
        default: false
  repository_dispatch:       # optionnel : webhook Kobo à chaque soumission
    types: [kobo_submission]

permissions:
  contents: write

concurrency:
  group: sync-matrice
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Africa/Abidjan
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Déterminer le mode (hebdomadaire = avec e-mail)
        id: mode
        run: |
          if [ "${{ github.event.schedule }}" = "0 7 * * 1" ] || [ "${{ github.event.inputs.send_mail }}" = "true" ]; then
            echo "args=" >> "$GITHUB_OUTPUT"
          else
            echo "args=--no-mail --skip-if-unchanged" >> "$GITHUB_OUTPUT"
          fi

      - name: Synchroniser Kobo -> matrice
        id: sync
        env:
          KOBO_URL: ${{ vars.KOBO_URL || 'https://kf.kobotoolbox.org' }}
          KOBO_ASSET_UID: ${{ secrets.KOBO_ASSET_UID }}
          KOBO_TOKEN: ${{ secrets.KOBO_TOKEN }}
          MATRIX_DIR: matrices
          MATRIX_KEEP: "8"
          PHOTO_DIR: photos
          HISTORY_DIR: historique
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: python kobo_matrice_sync.py ${{ steps.mode.outputs.args }}

      - name: Enregistrer matrice, photos et journal dans le dépôt
        if: ${{ !cancelled() }}
        run: |
          git config user.name  "kobo-sync-bot"
          git config user.email "kobo-sync-bot@users.noreply.github.com"
          git add -A matrices photos historique
          if git diff --cached --quiet; then
            echo "Aucun changement à enregistrer."
          else
            git commit -m "Matrice mise à jour automatiquement ($(date +%d/%m/%Y' '%H:%M))"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Archiver la matrice (téléchargeable depuis le run)
        if: ${{ steps.sync.outputs.matrix_path != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: matrice-de-suivi
          path: ${{ steps.sync.outputs.matrix_path }}
          retention-days: 30
